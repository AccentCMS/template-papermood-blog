# Site-wide frontmatter defaults. This project model replaces the theme's
# `default` model (same name), extends the theme's `post` model (same
# vocabulary, same validation), and adds inherited default values. A value
# from `defaults:` applies when a page's frontmatter omits the field; a
# page that writes the field keeps its own value.
#
# The posts of this starter omit `author`, so they all show the name
# below. Put your name here once instead of in every post -- and override
# it per post with an `author:` line when a guest writes one.
name: Post
description: The theme post model plus the site-wide frontmatter defaults.
extends: post

defaults:
  author: Your Name
